name: Browser MVP — acessibilidade e Playwright
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint básico e estrutura estática
        run: |
          node --check app.js
          node --check config.js
          node --check tests/browser-qa.cjs
          node tests/static-qa.cjs
      - name: Playwright e Chrome existente, com fallback Chromium
        run: |
          npm install --prefix /tmp/mvp-playwright --no-save --package-lock=false playwright@1.56.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            /tmp/mvp-playwright/node_modules/.bin/playwright install --with-deps chromium
          fi
      - name: Testar fluxos e capturar 5 resoluções
        run: NODE_PATH=/tmp/mvp-playwright/node_modules node tests/browser-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvp-screenshots-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14
